[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-e2ee"
version = "0.1.0"
description = "Persistent WhatsApp message and media encryption orchestration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["whatsapp-signal-protocol==0.1.0", "whatsapp-protocol-tree-node==0.1.0", "cryptography>=43", "protobuf>=6.33.5,<7"]

[project.optional-dependencies]
test = ["pytest>=8", "build>=1", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
